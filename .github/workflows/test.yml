name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Emacs ${{ matrix.emacs-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # bin/limen is a POSIX shell script, and it is what a harness's hook
        # runs; Windows has nothing to run it with.
        os: [ubuntu-latest, macos-latest]
        emacs-version: ['29.1', '30.1']

    steps:
      - uses: actions/checkout@v4

      - uses: jcs090218/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - uses: emacs-eask/setup-eask@master
        with:
          version: snapshot

      - name: Install dependencies
        run: eask install-deps --dev

      - name: Analyze Eask
        run: eask analyze --strict

      - name: Compile
        run: eask compile

      - name: Compile tests
        run: eask compile --strict "limen*-tests.el"

      - name: Test
        run: eask run script test

      - name: Test extensions
        run: eask run script test-extensions

      - name: Checkdoc
        run: eask lint checkdoc --strict

      # package-lint warns on the with-eval-after-load that attaches the herd
      # menu once herdr loads; --strict would make that warning fatal.
      - name: Package lint
        run: eask lint package

      - name: Check declarations
        run: eask lint declare --strict

      - name: Check indentation
        run: eask lint indent --strict

      - name: Check keywords
        run: eask lint keywords --strict

      # relint reads docstrings as regexp strings, so the \= that keeps a
      # trailing quote from being rendered reads to it as a dead escape.
      - name: Check regular expressions
        run: eask lint regexps

      - name: Check license
        run: eask lint license --strict
